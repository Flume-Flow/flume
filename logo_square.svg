<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 10000 10000">

    <style>
        .main {
        fill: #040F51;
        transition: fill 0.3s ease;
        }
        @media (prefers-color-scheme: dark) {
        .main {
        fill: #00FF00;
        }
        }
    </style>

    <path d="M 0 3000
             a 3000 3000 0 0 1 3000 -3000
             h 7000
             A 3000 3000 0 0 1 7000 3000
             h -4000
             a 3000 3000 0 0 0 -3000 3000 Z"
          class="main"
          id="top-leaf"/>

    <path d="M 0 6500
             a 3000 3000 0 0 1 3000 -3000
             h 6100
             a 3000 3000 0 0 1 -3000 3000
             h -3100
             a 3000 3000 0 0 0 -3000 3000 Z"
          fill="#0057B7"
          id="middle-leaf"/>

    <path d="M 0 10000
             a 3000 3000 0 0 1 3000 -3000
             h 500
             a 3000 3000 0 0 1 -3000 3000 Z"
          fill="#FFD700"
          id="bottom-leaf"/>

    <path d="M 3850 7000
             a 350 350 0 0 1 350 350
             v 2300
             a 350 350 0 0 0 350 350
             h -350
             a 350 350 0 0 1 -350 -350 Z"
          class="main"
          id="letter-l"/>

    <path d="M 4550 7000
              a 350 350 0 0 1 350 350
              v 1950
              a 350 350 0 0 0 350 350
              v -2650
              a 350 350 0 0 1 350 350
              v 2300
              a 350 350 0 0 0 350 350
              h -1050
              a 350 350 0 0 1 -350 -350 Z"
          class="main"
          id="letter-u"/>

    <path d="M 6300 7000
