    <path d="M 8400 7000
               h 350
               a 350 350 0 0 1 350 350
               v 975
               a 350 350 0 0 1 -350 350
               a 350 350 0 0 0 -350 350
               v 275
               a 350 350 0 0 0 350 350
               a 350 350 0 0 1 350 350
               h -700
               a 350 350 0 0 1 -350 -350
               v -2300
               a 350 350 0 0 1 350 -350 Z

               M 8400 7700
               a 350 350 0 0 1 350 -350
               v 625
               a 350 350 0 0 1 -350 350 Z"
