name: Track unlinked commits

on:
  push:
    branches:
      - main

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Check for linked PR
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          pr_count=$(gh api \
            -H "Accept: application/vnd.github.groot-preview+json" \
            /repos/${{ github.repository }}/commits/${{ github.sha }}/pulls \
            --jq 'length')
          echo "pr_count=$pr_count" >> "$GITHUB_OUTPUT"

      - name: Resolve project node ID
        if: steps.check-pr.outputs.pr_count == '0'
        id: resolve-project
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          project_id=$(gh api graphql -f query='
            query {
              viewer {
                projectsV2(first: 20) {
                  nodes { id title }
                }
              }
            }' --jq '.data.viewer.projectsV2.nodes[] | select(.title == "Flume") | .id')
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: Create draft issue
        if: steps.check-pr.outputs.pr_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PROJECT_ID: ${{ steps.resolve-project.outputs.project_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          first_line=$(echo "$COMMIT_MSG" | head -1)
          title="Unlinked commit: ${first_line} (${COMMIT_SHA:0:7})"
          gh api graphql \
            -f query='mutation($pid: ID!, $t: String!) {
              addProjectV2DraftIssue(input: { projectId: $pid, title: $t }) {
                projectItem { id }
              }
            }' \
            -f pid="$PROJECT_ID" \
            -f t="$title"
