name: CI

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build @flume/cli
        run: yarn workspace @flume/cli build

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Lint
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q 'eslint.config'; then
            echo "ESLint config changed — linting all files"
            yarn lint
          else
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(js|ts|mjs)$' | tr '\n' ' ')
            if [ -n "$CHANGED" ]; then
              echo "Linting changed files: $CHANGED"
              ./node_modules/.bin/eslint $CHANGED
            else
              echo "No JS/TS files changed — skipping lint"
            fi
          fi

  test:
    runs-on: ${{ matrix.os }}
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      pull-requests: write
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests with coverage
        run: yarn test:coverage 2>&1 | tee /tmp/coverage.txt

      - name: Extract coverage table
        id: cov
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        run: |
          TABLE=$(awk '/^--/{found=1} found && !/Done in/{print}' /tmp/coverage.txt)
          echo "table<<EOF" >> $GITHUB_OUTPUT
          echo "$TABLE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post coverage comment
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          message: |
            ## Coverage
            ```
            ${{ steps.cov.outputs.table }}
            ```
