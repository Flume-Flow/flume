name: CI

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  lint:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Lint
        run: |
          if git diff --name-only origin/${{ github.base_ref }}..HEAD | grep -q 'biome.json'; then
            echo "Biome config changed — linting all files"
            pnpm lint
          else
            CHANGED=$(node scripts/changed-files.js --base "origin/${{ github.base_ref }}" | tr '\n' ' ')
            if [ -n "$CHANGED" ]; then
              echo "Linting changed files: $CHANGED"
              ./node_modules/.bin/biome check $CHANGED
            else
              echo "No JS/TS files changed — skipping lint"
            fi
          fi

  test:
    runs-on: ${{ matrix.os }}
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      pull-requests: write
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests (with coverage on ubuntu)
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            pnpm test:coverage
          else
            pnpm test
          fi

      - name: Fetch base branch for diff
        if: always() && github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Generate coverage comment
        id: cov
        if: always() && github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        run: |
          CHANGED=$(node scripts/changed-files.js --base "origin/${{ github.base_ref }}" --ext js,ts,mjs)
          if [ -z "$CHANGED" ]; then
            echo "has_js=false" >> $GITHUB_OUTPUT
          else
            echo "has_js=true" >> $GITHUB_OUTPUT
            COMMENT=$(echo "$CHANGED" | node scripts/coverage-comment.js)
            echo "comment<<EOF" >> $GITHUB_OUTPUT
            echo "$COMMENT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Post coverage comment
        if: always() && github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && steps.cov.outputs.has_js == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage
          message: ${{ steps.cov.outputs.comment }}
